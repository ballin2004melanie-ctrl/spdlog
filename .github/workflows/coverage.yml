name: spdlog - coverage (gcovr)

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ python3-pip
          # 用 pip 装最新版 gcovr，避免 apt 版本差异导致参数行为不一致
          pip3 install --upgrade gcovr

      - name: Configure (tests + coverage flags)
        run: |
          cmake -S . -B build -G Ninja \
            -DSPDLOG_BUILD_TESTS=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="--coverage -O0 -g" \
            -DCMAKE_C_FLAGS="--coverage -O0 -g" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage" \
            -DCMAKE_SHARED_LINKER_FLAGS="--coverage"

      - name: Build
        run: cmake --build build

      - name: Run tests (generate coverage data)
        run: ctest --test-dir build --output-on-failure

      - name: Generate coverage reports
        run: |
          cd build

          # 1) HTML 详细报告（注意：用 -o 指定输出文件）
          gcovr -r .. --print-summary \
            --html --html-details -o coverage.html

          # 2) Cobertura XML（同样用 -o 指定输出文件）
          gcovr -r .. --print-summary \
            --cobertura-pretty -o cobertura.xml

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spdlog-coverage
          path: |
            build/coverage.html
            build/cobertura.xml
