name: spdlog - coverage (gcovr)

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  coverage:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          set -eux
          sudo apt-get update
          # 不强制装 gcc-13，避免 apt exit code 100（找不到包）
          sudo apt-get install -y cmake ninja-build g++ python3-pip
          pip3 install --upgrade gcovr

      - name: Configure (tests + coverage flags)
        run: |
          set -eux
          cmake -S . -B build -G Ninja \
            -DSPDLOG_BUILD_TESTS=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="--coverage -O0 -g" \
            -DCMAKE_C_FLAGS="--coverage -O0 -g" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage" \
            -DCMAKE_SHARED_LINKER_FLAGS="--coverage"

      - name: Build
        run: |
          set -eux
          cmake --build build

      - name: Run tests (generate coverage data)
        run: |
          set -eux
          ctest --test-dir build --output-on-failure

      - name: Generate coverage reports
        run: |
          set -eux
          cd build

          # HTML 详细报告
          gcovr -r .. --print-summary \
            --gcov-executable gcov \
            --gcov-ignore-parse-errors=all \
            --html --html-details -o coverage.html

          # Cobertura XML
          gcovr -r .. --print-summary \
            --gcov-executable gcov \
            --gcov-ignore-parse-errors=all \
            --cobertura-pretty -o cobertura.xml

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spdlog-coverage
          path: |
            build/coverage.html
            build/cobertura.xml
