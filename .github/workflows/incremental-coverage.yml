name: spdlog - incremental coverage (gcovr)

on:
  workflow_dispatch:

jobs:
  incremental_coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ python3-pip
          pip3 install --upgrade gcovr matplotlib

      - name: Configure (tests + coverage flags)
        run: |
          set -eux
          cmake -S . -B build -G Ninja \
            -DSPDLOG_BUILD_TESTS=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="--coverage -O0 -g" \
            -DCMAKE_C_FLAGS="--coverage -O0 -g" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage" \
            -DCMAKE_SHARED_LINKER_FLAGS="--coverage"

      - name: Build
        run: |
          set -eux
          cmake --build build

      - name: Locate spdlog-utests binary (absolute path)
        run: |
          set -eux
          UTESTS_REL="$(find build -type f -name spdlog-utests -perm -111 | head -n 1 || true)"
          if [ -z "$UTESTS_REL" ]; then
            echo "ERROR: spdlog-utests binary not found."
            find build -maxdepth 3 -type f | head -n 200
            exit 1
          fi
          UTESTS_ABS="$(realpath "$UTESTS_REL")"
          echo "Found utests: $UTESTS_ABS"
          echo "UTESTS_ABS=$UTESTS_ABS" >> "$GITHUB_ENV"

      - name: Prepare incremental test groups (Catch2)
        run: |
          set -eux
          mkdir -p build/groups

          # 1) 列出 Catch2 test case 名称
          # 优先用 --list-test-names-only，失败则 fallback
          if "$UTESTS_ABS" --list-test-names-only > build/all_tests.txt 2>/dev/null; then
            echo "Listed tests via --list-test-names-only"
          else
            echo "Fallback: --list-tests --verbosity quiet"
            "$UTESTS_ABS" --list-tests --verbosity quiet > build/all_tests.txt
          fi

          sed -i '/^\s*$/d' build/all_tests.txt
          echo "Total testcases:"
          wc -l build/all_tests.txt

          # 2) 分成 5 组（要更少就把 5 改成 3）
          split -d -n l/5 build/all_tests.txt build/groups/group_ --additional-suffix=.txt
          ls -l build/groups

      - name: Run groups cumulatively + collect summaries
        run: |
          set -eux

          # 从 0 开始累计覆盖率
          find build -name "*.gcda" -delete || true

          echo "stage,lines_pct,functions_pct,branches_pct" > build/coverage_increment.csv

          # 关键：排除第三方依赖目录 build/_deps，避免 Catch2 的 gcno/gcda 导致 gcov 出错
          # --exclude-directories 在搜索 raw coverage 数据时就会跳过目录 :contentReference[oaicite:2]{index=2}
          EXCLUDES=(
            --exclude-directories "build/_deps"
            --exclude-directories "build/_deps/.*"
            --exclude "build/_deps/.*"
            --exclude "include/spdlog/fmt/bundled/.*"
          )

          stage=1
          for f in build/groups/group_*.txt; do
            echo "=== Running stage $stage with file: $f ==="

            # Catch2: -f/--input-file 跑子集
            "$UTESTS_ABS" -f "$f"

            # 关键：加上 --gcov-ignore-errors=all，忽略 gcov 调用错误 :contentReference[oaicite:3]{index=3}
            out="$(gcovr -r . --print-summary \
              --gcov-executable gcov \
              --gcov-ignore-errors all \
              --gcov-ignore-parse-errors all \
              "${EXCLUDES[@]}")"

            echo "$out"

            lines_pct="$(echo "$out" | grep -E '^lines:' | awk '{print $2}' | tr -d '%')"
            func_pct="$(echo "$out" | grep -E '^functions:' | awk '{print $2}' | tr -d '%')"
            br_pct="$(echo "$out" | grep -E '^branches:' | awk '{print $2}' | tr -d '%')"

            echo "${stage},${lines_pct},${func_pct},${br_pct}" >> build/coverage_increment.csv
            stage=$((stage+1))
          done

          echo "=== Increment CSV ==="
          cat build/coverage_increment.csv

      - name: Plot incremental coverage chart
        run: |
          set -eux
          python3 - <<'PY'
          import csv
          import matplotlib.pyplot as plt

          stages, lines, funcs, brs = [], [], [], []
          with open("build/coverage_increment.csv", newline="") as f:
              r = csv.DictReader(f)
              for row in r:
                  stages.append(int(row["stage"]))
                  lines.append(float(row["lines_pct"]))
                  funcs.append(float(row["functions_pct"]))
                  brs.append(float(row["branches_pct"]))

          plt.figure()
          plt.plot(stages, lines, marker="o", label="Lines")
          plt.plot(stages, funcs, marker="o", label="Functions")
          plt.plot(stages, brs, marker="o", label="Branches")
          plt.xlabel("Cumulative test group stage")
          plt.ylabel("Coverage (%)")
          plt.title("Incremental Coverage (spdlog-utests grouped)")
          plt.legend()
          plt.grid(True, linestyle="--", linewidth=0.5)
          plt.savefig("build/coverage_increment.png", dpi=200, bbox_inches="tight")
          print("Saved: build/coverage_increment.png")
          PY

      - name: Generate final HTML report
        run: |
          set -eux
          gcovr -r . --print-summary \
            --gcov-executable gcov \
            --gcov-ignore-errors all \
            --gcov-ignore-parse-errors all \
            --exclude-directories "build/_deps" \
            --exclude "build/_deps/.*" \
            --exclude "include/spdlog/fmt/bundled/.*" \
            --html --html-details -o build/coverage_final.html

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spdlog-incremental-coverage
          path: |
            build/coverage_increment.csv
            build/coverage_increment.png
            build/coverage_final.html
