name: spdlog - incremental coverage (gcovr)

on:
  workflow_dispatch:

jobs:
  incremental_coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ python3-pip
          pip3 install --upgrade gcovr matplotlib

      - name: Configure (tests + coverage flags)
        run: |
          set -eux
          cmake -S . -B build -G Ninja \
            -DSPDLOG_BUILD_TESTS=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="--coverage -O0 -g" \
            -DCMAKE_C_FLAGS="--coverage -O0 -g" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage" \
            -DCMAKE_SHARED_LINKER_FLAGS="--coverage"

      - name: Build
        run: |
          set -eux
          cmake --build build

      - name: Locate spdlog-utests binary
        run: |
          set -eux
          # 自动找可执行文件（不同平台/生成器路径可能不同）
          UTESTS="$(find build -type f -name spdlog-utests -perm -111 | head -n 1 || true)"
          if [ -z "$UTESTS" ]; then
            echo "ERROR: spdlog-utests binary not found."
            echo "Dump build tree (top 3 levels):"
            find build -maxdepth 3 -type f | head -n 200
            exit 1
          fi
          echo "Found utests: $UTESTS"
          echo "UTESTS=$UTESTS" >> $GITHUB_ENV

      - name: Prepare incremental test groups (Catch2)
        run: |
          set -eux
          cd build

          echo "Use utests: $UTESTS"

          # 1) 列出 Catch2 test case 名称
          # Catch2 v2 支持 --list-test-names-only :contentReference[oaicite:1]{index=1}
          # 若不支持则 fallback 到 --list-tests --verbosity quiet（Catch2 v3 常用方式）:contentReference[oaicite:2]{index=2}
          if "$UTESTS" --list-test-names-only > all_tests.txt 2>/dev/null; then
            echo "Listed tests via --list-test-names-only"
          else
            echo "Fallback: --list-tests --verbosity quiet"
            "$UTESTS" --list-tests --verbosity quiet > all_tests.txt
          fi

          # 清理空行
          sed -i '/^\s*$/d' all_tests.txt

          echo "Total testcases:"
          wc -l all_tests.txt

          # 2) 分成 5 组（可改成 3 组：把 5 改成 3）
          mkdir -p groups
          split -d -n l/5 all_tests.txt groups/group_ --additional-suffix=.txt

          ls -l groups

      - name: Run groups cumulatively + collect summaries
        run: |
          set -eux
          cd build

          # 从 0 开始累计覆盖率
          find . -name "*.gcda" -delete || true

          echo "stage,lines_pct,functions_pct,branches_pct" > coverage_increment.csv

          # 按组累计：1→2→3→4→5
          stage=1
          for f in groups/group_*.txt; do
            echo "=== Running stage $stage with file: $f ==="
            # Catch2 支持 -f/--input-file 来运行文件中列出的 testcases :contentReference[oaicite:3]{index=3}
            "$UTESTS" -f "$f"

            out="$(gcovr -r .. --print-summary --gcov-executable gcov --gcov-ignore-parse-errors=all || true)"
            echo "$out"

            lines_pct="$(echo "$out" | grep -E '^lines:' | awk '{print $2}' | tr -d '%')"
            func_pct="$(echo "$out" | grep -E '^functions:' | awk '{print $2}' | tr -d '%')"
            br_pct="$(echo "$out" | grep -E '^branches:' | awk '{print $2}' | tr -d '%')"

            echo "${stage},${lines_pct},${func_pct},${br_pct}" >> coverage_increment.csv
            stage=$((stage+1))
          done

          echo "=== Increment CSV ==="
          cat coverage_increment.csv

      - name: Plot incremental coverage chart
        run: |
          set -eux
          cd build

          python3 - <<'PY'
          import csv
          import matplotlib.pyplot as plt

          stages, lines, funcs, brs = [], [], [], []
          with open("coverage_increment.csv", newline="") as f:
              r = csv.DictReader(f)
              for row in r:
                  stages.append(int(row["stage"]))
                  lines.append(float(row["lines_pct"]))
                  funcs.append(float(row["functions_pct"]))
                  brs.append(float(row["branches_pct"]))

          plt.figure()
          plt.plot(stages, lines, marker="o", label="Lines")
          plt.plot(stages, funcs, marker="o", label="Functions")
          plt.plot(stages, brs, marker="o", label="Branches")
          plt.xlabel("Cumulative test group stage")
          plt.ylabel("Coverage (%)")
          plt.title("Incremental Coverage (spdlog-utests grouped)")
          plt.legend()
          plt.grid(True, linestyle="--", linewidth=0.5)
          plt.savefig("coverage_increment.png", dpi=200, bbox_inches="tight")
          print("Saved: coverage_increment.png")
          PY

      - name: Generate final HTML report
        run: |
          set -eux
          cd build
          gcovr -r .. --print-summary --gcov-executable gcov --gcov-ignore-parse-errors=all \
            --html --html-details -o coverage_final.html

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spdlog-incremental-coverage
          path: |
            build/coverage_increment.csv
            build/coverage_increment.png
            build/coverage_final.html
