name: spdlog - coverage (gcovr)

on:
  workflow_dispatch:

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ gcovr

      - name: Configure (tests + coverage flags)
        run: |
          cmake -S . -B build -G Ninja \
            -DSPDLOG_BUILD_TESTS=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="--coverage -O0 -g" \
            -DCMAKE_C_FLAGS="--coverage -O0 -g" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage" \
            -DCMAKE_SHARED_LINKER_FLAGS="--coverage"

      - name: Build
        run: cmake --build build

      - name: Run tests (generate .gcda)
        run: ctest --test-dir build --output-on-failure

      - name: Generate coverage reports
        run: |
          cd build
          gcovr -r .. --html-details coverage.html --xml-pretty cobertura.xml --print-summary

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spdlog-coverage
          path: |
            build/coverage.html
            build/cobertura.xml
